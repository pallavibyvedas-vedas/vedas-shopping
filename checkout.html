<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDAS | Checkout</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .checkout-page {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .checkout-page h1 {
      color: #7A1F2B;
    }

    .checkout-form {
      display: grid;
      gap: 15px;
      margin-top: 25px;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .checkout-form button {
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #7A1F2B;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #orderMessage {
      margin-top: 15px;
      color: #7A1F2B;
    }
  </style>
</head>

<body>

  <main class="checkout-page">
    <h1>📦 Checkout</h1>
    <p>अपनी डिलीवरी की जानकारी भरें।</p>

    <div id="orderTotal"></div>

    <form class="checkout-form" id="checkoutForm">
      <input type="text" id="customerName"
        placeholder="पूरा नाम" required>

      <input type="tel" id="customerPhone"
        placeholder="मोबाइल नंबर" pattern="[0-9]{10}"
        maxlength="10" required>

      <textarea id="customerAddress"
        placeholder="पूरा डिलीवरी पता" rows="4" required></textarea>

      <input type="text" id="customerCity"
        placeholder="शहर" required>

      <input type="text" id="customerPincode"
        placeholder="पिन कोड" pattern="[0-9]{6}"
        maxlength="6" required>

      <button type="submit">Place Order</button>
    </form>

    <p id="orderMessage"></p>
    <a href="cart.html">← वापस Cart में जाएँ</a>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem("vedasCart")) || [];

    const total = cart.reduce((sum, item) => {
      return sum + (Number(item.price) || 0) *
        (Number(item.quantity) || 1);
    }, 0);

    document.getElementById("orderTotal").innerHTML =
      "<h2>Order Total: ₹" + total + "</h2>";

    document.getElementById("checkoutForm").addEventListener("submit", function(event) {
      event.preventDefault();

      if (cart.length === 0) {
        document.getElementById("orderMessage").textContent =
          "आपका Cart खाली है। पहले कोई Product जोड़ें।";
        return;
      }

      const order = {
        name: document.getElementById("customerName").value,
        phone: document.getElementById("customerPhone").value,
        address: document.getElementById("customerAddress").value,
        city: document.getElementById("customerCity").value,
        pincode: document.getElementById("customerPincode").value,
        items: cart,
        total: total,
        date: new Date().toISOString()
      };

      localStorage.setItem("vedasLastOrder", JSON.stringify(order));

      document.getElementById("orderMessage").textContent =
        "जानकारी दर्ज हो गई है। यह अभी Demo Checkout है; Order वास्तव में भेजा नहीं गया है।";
    });
  </script>

</body>
</html>
